[env]
platform = espressif8266
board = esp12e
framework = arduino

monitor_speed = 115200
monitor_filters = esp8266_exception_decoder, default

lib_deps =
    tzapu/WiFiManager @ ^2.0.17
    knolleary/PubSubClient @ ^2.8
    pololu/VL53L0X @ ^1.3.1

; Flash over USB serial (requires manual GPIO0/reset into flash mode on
; this bare ESP-12E module).
[env:esp12e]
upload_protocol = esptool

; Flash over WiFi using the ArduinoOTA service already running in the
; firmware. No serial connection or flash-mode wiring needed, but the
; device must already be running firmware with ArduinoOTA active.
[env:esp12e_ota]
upload_protocol = espota
upload_port = garage-opener_v3-esp8266.local
